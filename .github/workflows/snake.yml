# 🐍 잔디 먹는 뱀 그림을 만들어서 output 브랜치에 올려요
name: Snake

on:
  schedule:
    - cron: "0 15 * * *" # 매일 한국 시간 자정에 새로 그려요
  workflow_dispatch: # Actions 탭에서 직접 실행할 수도 있어요
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 뱀 그림 만들기
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#f59e0b&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#8b5cf6,#6d28d9
            dist/snake-dark.svg?palette=github-dark&color_snake=#fcd34d&color_dots=#161b22,#3b2c6b,#5b40a8,#8b5cf6,#c4b5fd

      - name: output 브랜치에 올리기
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
